    <script>

        // javascript assignment 1

        // Exercise 1
        let num1 = 10;
        let num2 = 20;
        console.log("The sum of num1 and num2 is:", num1 + num2);

        // Exercise 2
        let a = 50;
        let b = 15;
        console.log("The difference of a and b is:", a - b);

        // Exercise 3
        let x = 5;
        let y = 3;
        console.log("The product of x and y is:", x * y);

        // Exercise 4
        let total = 100;
        let parts = 4;
        console.log("Division:", total / parts);

        // Exercise 5
        let math = 80;
        let english = 70;
        let science = 90;
        console.log("Total Marks:", math + english + science);

        // Exercise 6
        let totalMarks = 240;
        let subjects = 3;
        console.log("Average:", totalMarks / subjects);

        // Exercise 7
        let length = 10;
        let width = 5;
        console.log("Rectangle Area:", length * width);

        // Exercise 8
        let currentAge = 20;
        let afterAge = 5;
        console.log("Age after 5 years:", currentAge + afterAge);

        // Exercise 9
        let weeklyPocketMoney = 500;
        console.log("Pocket Money:", weeklyPocketMoney * 4);

        // Exercise 10
        let penPrice = 30;
        let notebookPrice = 120;
        let eraserPrice = 20;
        console.log("Total Cost:", penPrice + notebookPrice + eraserPrice);

        // Exercise 11
        let basicSalary = 30000;
        let bonus = 5000;
        console.log("Salary:", basicSalary + bonus);

        // Exercise 12
        let match1 = 45;
        let match2 = 60;
        let match3 = 80;
        console.log("Cricket Score:", match1 + match2 + match3);

        // Challenge
        let z = 10;
        let r = "5";

        console.log(z + r);
        console.log(z - r);
        console.log(z * r);
        console.log(z / r);

    </script>
