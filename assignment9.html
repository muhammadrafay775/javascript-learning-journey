<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11 | Event Countdown</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
        <style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#312e81,#0f766e);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:#fff;
}

@keyframes bg{

0%{
background-position:0% 50%;
}

50%{
background-position:100% 50%;
}

100%{
background-position:0% 50%;
}

}

.container{
    width:100%;
    max-width:900px;
}

.back-btn{
    display:inline-block;
    margin-bottom:25px;
    text-decoration:none;
    color:white;
    background:#2563eb;
    padding:12px 22px;
    border-radius:50px;
    font-weight:600;
    transition:.3s;
}

.back-btn:hover{
    background:#1d4ed8;
    transform:translateX(-5px);
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:25px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.badge{
    display:inline-block;
    background:linear-gradient(45deg,#06b6d4,#2563eb);
    padding:10px 25px;
    border-radius:50px;
    margin-bottom:20px;
    font-weight:bold;
}

.card h1{
    font-size:38px;
    margin-bottom:10px;
}

.card p{
    color:#d1d5db;
    margin-bottom:30px;
    line-height:1.7;
}

.form{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.input-group{
    display:flex;
    flex-direction:column;
}

.input-group label{
    margin-bottom:8px;
    color:#38bdf8;
    font-weight:600;
}

input[type="date"]{
    padding:15px;
    border:none;
    outline:none;
    border-radius:12px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    color:white;
    font-size:16px;
}

button{
    margin-top:10px;
    padding:16px;
    border:none;
    border-radius:50px;
    cursor:pointer;
    font-size:17px;
    font-weight:600;
    color:white;
    background:linear-gradient(45deg,#06b6d4,#2563eb);
    transition:.3s;
}

button:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 25px rgba(37,99,235,.4);
}

.result{
    margin-top:35px;
    background:#111827;
    border-radius:18px;
    padding:30px;
    border-left:6px solid #06b6d4;
}

.result h2{
    margin-bottom:20px;
    color:#38bdf8;
}

.box{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.box:last-child{
    border-bottom:none;
}

.box span{
    color:#d1d5db;
    font-weight:500;
}

.box strong{
    color:#fff;
    font-size:18px;
}

@media(max-width:768px){

.card{
    padding:25px;
}

.card h1{
    font-size:28px;
}

.box{
    flex-direction:column;
    align-items:flex-start;
    gap:8px;
}

button{
    width:100%;
}

}</style>
</head>

<body>

    <div class="container">

        <a href="index.html" class="back-btn">← Back to Home</a>

        <div class="card">

            <span class="badge">Assignment 9</span>

            <h1>📅 Event Countdown & Duration Calculator</h1>

            <p>
                Select today's date and your event date to calculate the remaining duration.
            </p>

            <div class="form">

                <div class="input-group">

                    <label>Today's Date</label>

                    <input type="date" id="todayInput">

                </div>

                <div class="input-group">

                    <label>Event Date</label>

                    <input type="date" id="eventInput">

                </div>

                <button id="calculateButton">
                    Calculate Remaining Time
                </button>

            </div>

            <div id="result" class="result">

                <h2>Result</h2>

                <p>Select dates and click the button.</p>

            </div>

        </div>

    </div>

    <script>

        let todayInput =
            document.getElementById("todayInput")

        let eventInput =
            document.getElementById("eventInput")

        let calculateButton =
            document.getElementById("calculateButton")

        let result =
            document.getElementById("result")

        let calculateTime = () => {

            if (todayInput.value == "" || eventInput.value == "") {

                result.innerHTML = `
                <h2>⚠ Missing Input</h2>
                <p>Please select both dates.</p>
                `

                return

            }

            let todayDate =
                new Date(todayInput.value)

            let eventDate =
                new Date(eventInput.value)

            let milliseconds =
                eventDate.getTime() - todayDate.getTime()

            let seconds =
                milliseconds / 1000

            let minutes =
                seconds / 60

            let hours =
                minutes / 60

            let days =
                hours / 24

            let months =
                days / 30

            let years =
                months / 12

            result.innerHTML = `

            <h2>Remaining Time</h2>

            <div class="box">

                <span>Milliseconds</span>
                <strong>${milliseconds}</strong>

            </div>

            <div class="box">

                <span>Seconds</span>
                <strong>${seconds.toFixed(2)}</strong>

            </div>

            <div class="box">

                <span>Minutes</span>
                <strong>${minutes.toFixed(2)}</strong>

            </div>

            <div class="box">

                <span>Hours</span>
                <strong>${hours.toFixed(2)}</strong>

            </div>

            <div class="box">

                <span>Days</span>
                <strong>${days.toFixed(2)}</strong>

            </div>

            <div class="box">

                <span>Months</span>
                <strong>${months.toFixed(2)}</strong>

            </div>

            <div class="box">

                <span>Years</span>
                <strong>${years.toFixed(2)}</strong>

            </div>

            `

        }

        calculateButton.addEventListener(
            "click",
            calculateTime
        )

    </script>

</body>

</html>
