<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake API Store</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:40px 20px;
    background:linear-gradient(-45deg,#0f172a,#1e3a8a,#312e81,#0f766e);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:#fff;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

h1{
    text-align:center;
    font-size:42px;
    margin-bottom:40px;
}

#products{
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:25px;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:25px;
    text-align:center;
    transition:.35s;
    box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.card:hover{
    transform:translateY(-10px);
    box-shadow:0 20px 45px rgba(6,182,212,.25);
}

.card img{
    width:170px;
    height:170px;
    object-fit:contain;
    background:#fff;
    border-radius:15px;
    padding:10px;
}

.card h3{
    margin:20px 0 10px;
    font-size:18px;
    height:55px;
    overflow:hidden;
}

.category{
    color:#cbd5e1;
    font-size:14px;
    margin-bottom:12px;
    text-transform:capitalize;
}

.price{
    font-size:28px;
    color:#22c55e;
    font-weight:bold;
    margin:15px 0;
}

.rating{
    display:inline-block;
    background:#facc15;
    color:#000;
    padding:8px 18px;
    border-radius:50px;
    font-weight:bold;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#06b6d4,#2563eb);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:translateY(-4px);
}

@media(max-width:768px){

h1{
    font-size:30px;
}

}
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        #products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
        }

        .card{
            background:white;
            border-radius:10px;
            padding:15px;
            text-align:center;
            box-shadow:0 5px 10px rgba(0,0,0,.15);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .card img{
            width:150px;
            height:150px;
            object-fit:contain;
            margin-bottom:10px;
        }

        .card h3{
            font-size:18px;
            margin:10px 0;
            height:50px;
            overflow:hidden;
        }

        .price{
            color:green;
            font-size:20px;
            font-weight:bold;
            margin:10px 0;
        }

        .category{
            color:gray;
            margin-bottom:15px;
        }

        button{
            padding:10px 20px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }
        .container{
    max-width:1400px;
    margin:auto;
}

.back-btn{
    display:inline-flex;
    align-items:center;
    gap:10px;
    text-decoration:none;
    color:#fff;
    background:linear-gradient(45deg,#2563eb,#06b6d4);
    padding:12px 24px;
    border-radius:50px;
    font-weight:600;
    margin-bottom:30px;
    transition:.3s;
    box-shadow:0 10px 25px rgba(37,99,235,.35);
}

.back-btn:hover{
    transform:translateX(-5px);
    box-shadow:0 15px 35px rgba(6,182,212,.45);
}
    </style>

</head>
<body>
<div class="container">

<a href="index.html" class="back-btn">
    ← Back to Home
</a>

<h1>🛒 My E-Commerce Store</h1>

<div id="products"></div>

</div>

<script>

fetch("https://fakestoreapi.com/products")
.then(function(res){
    return res.json();
})
.then(function(data){

    let products = document.getElementById("products");

    for(let i = 0; i < data.length; i++){

        products.innerHTML += `
            <div class="card">
                <img src="${data[i].image}" width="150">
                <h3>${data[i].title}</h3>
                <p>$${data[i].price}</p>
                <button>Buy Now</button>
            </div>
        `;

    }

});

</script>

</body>
</html>
