<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 11 | Event Countdown</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<style>@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#312e81,#0f766e);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    overflow-x:hidden;
    color:#fff;
    position:relative;
}

@keyframes bg{

0%{background-position:0% 50%;}

50%{background-position:100% 50%;}

100%{background-position:0% 50%;}

}

/* Floating Blur */

.bg1,
.bg2{

position:fixed;
border-radius:50%;
filter:blur(120px);
z-index:-1;

}

.bg1{

width:320px;
height:320px;
background:#06b6d4;
top:-120px;
left:-120px;

}

.bg2{

width:280px;
height:280px;
background:#7c3aed;
bottom:-100px;
right:-100px;

}

/* Container */

.container{

width:100%;
max-width:900px;

}

/* Back Button */

.back-btn{

display:inline-flex;
align-items:center;
gap:10px;
text-decoration:none;
background:#2563eb;
color:white;
padding:12px 24px;
border-radius:50px;
margin-bottom:25px;
font-weight:600;
transition:.3s;

}

.back-btn:hover{

transform:translateX(-6px);
background:#1d4ed8;

}

/* Card */

.card{

background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.15);
border-radius:25px;
padding:40px;
box-shadow:0 20px 50px rgba(0,0,0,.4);

}

.badge{

display:inline-block;
padding:10px 24px;
background:linear-gradient(45deg,#06b6d4,#2563eb);
border-radius:50px;
font-weight:bold;
margin-bottom:20px;

}

.card h1{

font-size:42px;
margin-bottom:10px;

}

.card p{

color:#cbd5e1;
margin-bottom:30px;

}

/* Input */

.input-box{

display:flex;
flex-direction:column;
margin-bottom:25px;

}

.input-box label{

margin-bottom:10px;
font-weight:600;
color:#38bdf8;

}

.input-box i{

margin-right:8px;

}

input[type="date"]{

padding:16px;
border:none;
outline:none;
border-radius:14px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
color:white;
font-size:16px;

}

/* Button */

button{

width:100%;
padding:16px;
border:none;
border-radius:50px;
cursor:pointer;
font-size:17px;
font-weight:600;
color:white;
background:linear-gradient(45deg,#06b6d4,#2563eb);
transition:.3s;

}

button:hover{

transform:translateY(-5px);
box-shadow:0 12px 25px rgba(37,99,235,.45);

}

/* Result */

.result{

margin-top:35px;
background:#111827;
padding:30px;
border-radius:20px;
border-left:6px solid #06b6d4;

}

.placeholder{

text-align:center;

}

.placeholder i{

font-size:60px;
color:#38bdf8;
margin-bottom:15px;

}

.placeholder h2{

margin-bottom:10px;

}

/* Countdown Cards */

.time-grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-top:25px;

}

.time-card{

background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.1);
border-radius:20px;
padding:25px;
text-align:center;
transition:.3s;

}

.time-card:hover{

transform:translateY(-8px);

}

.time-card h3{

font-size:42px;
color:#38bdf8;
margin-bottom:10px;

}

.time-card p{

margin:0;
color:#ddd;
font-size:18px;

}

/* Error */

.error{

text-align:center;

}

.error i{

font-size:60px;
color:#ef4444;
margin-bottom:15px;

}

.error h2{

color:#ef4444;

}

/* Responsive */

@media(max-width:768px){

.card{

padding:25px;

}

.card h1{

font-size:30px;

}

.time-grid{

grid-template-columns:1fr;

}

}</style>
<body>

    <div class="bg1"></div>
    <div class="bg2"></div>

    <div class="container">

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Home
        </a>

        <div class="card">

            <span class="badge">Assignment 8</span>

            <h1>⏳ Event Countdown</h1>

            <p>
                Select an event date to calculate the remaining time.
            </p>

            <div class="input-box">

                <label>
                    <i class="fa-solid fa-calendar-days"></i>
                    Event Date
                </label>

                <input type="date" id="eventDate">

            </div>

            <button id="button">

                <i class="fa-solid fa-clock"></i>

                Remaining Time

            </button>

            <div id="output" class="result">

                <div class="placeholder">

                    <i class="fa-solid fa-hourglass-half"></i>

                    <h2>Countdown Result</h2>

                    <p>Select a date and click the button.</p>

                </div>

            </div>

        </div>

    </div>

<script>

let dateInput=document.getElementById("eventDate");
let button=document.getElementById("button");
let output=document.getElementById("output");

let calculateRemainingTime=()=>{

if(!dateInput.value){

output.innerHTML=`
<div class="error">
<i class="fa-solid fa-circle-exclamation"></i>
<h2>Please Select a Date</h2>
</div>
`;

return;

}

let now=new Date();

let eventDate=new Date(dateInput.value);

eventDate.setHours(0,0,0,0);

let ms=eventDate.getTime()-now.getTime();

if(ms<0){

output.innerHTML=`
<div class="error">
<i class="fa-solid fa-triangle-exclamation"></i>
<h2>This Event Has Already Passed!</h2>
</div>
`;

return;

}

let days=Math.floor(ms/(1000*60*60*24));

let hours=Math.floor((ms%(1000*60*60*24))/(1000*60*60));

let minutes=Math.floor((ms%(1000*60*60))/(1000*60));

let seconds=Math.floor((ms%(1000*60))/1000);

output.innerHTML=`

<h2>Remaining Time</h2>

<div class="time-grid">

<div class="time-card">
<h3>${days}</h3>
<p>Days</p>
</div>

<div class="time-card">
<h3>${hours}</h3>
<p>Hours</p>
</div>

<div class="time-card">
<h3>${minutes}</h3>
<p>Minutes</p>
</div>

<div class="time-card">
<h3>${seconds}</h3>
<p>Seconds</p>
</div>

</div>

`;

}

button.addEventListener("click",calculateRemainingTime);

</script>

</body>

</html>
